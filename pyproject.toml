[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-image-retrieval"
version = "1.0.0"
description = "Retrieval of the viewed image from one EEG trial (EEG/EMG Foundation Challenge 2026, Track 1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch", "torchaudio", "numpy", "pandas", "braindecode[hub]==1.8.1"]

[tool.setuptools]
packages = ["eeg_retrieval"]
